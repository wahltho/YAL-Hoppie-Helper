name: GitHub Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - stable
      version:
        description: Version to release, for example 2.1b1 or 2.1
        required: true
        type: string
      draft:
        description: Create the GitHub release as draft
        required: true
        type: boolean
        default: true
      release_notes:
        description: Optional release notes. Leave empty for a generated note.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and create release
    runs-on: ubuntu-latest
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ inputs.version }}
      DRAFT: ${{ inputs.draft }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release tooling
        run: |
          python3 -m py_compile .github/scripts/package_hoppiehelper_release.py
          python3 .github/scripts/test_package_hoppiehelper_release.py
          git diff --check

      - name: Build release package
        run: |
          python3 .github/scripts/package_hoppiehelper_release.py \
            --channel "$CHANNEL" \
            --version "$VERSION" \
            --output-dir dist

      - name: Prepare release notes
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > dist/release-notes.md
          else
            {
              printf 'YAL HoppieHelper %s\n\n' "$VERSION"
              printf 'Channel: %s\n' "$CHANNEL"
              printf 'Commit: %s\n\n' "$GITHUB_SHA"
              printf '%s\n' 'This GitHub release contains:'
              printf '%s\n' '- full-install ZIP package'
              printf '%s\n' '- file-list manifest'
              printf '%s\n' '- machine-readable JSON manifest'
              printf '%s\n\n' '- SHA-256 checksums file'
              printf '%s\n' 'The ZIP is built from the committed deploy artifacts in this repository.'
            } > dist/release-notes.md
          fi

      - name: Create GitHub release
        run: |
          tag="r${VERSION}"
          title="YAL HoppieHelper ${VERSION}"
          prerelease_flag=()
          draft_flag=()

          if [ "$CHANNEL" = "beta" ]; then
            title="YAL HoppieHelper ${VERSION} (Beta)"
            prerelease_flag=(--prerelease)
          fi
          if [ "$DRAFT" = "true" ]; then
            draft_flag=(--draft)
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Delete it or choose another version before rerunning." >&2
            exit 1
          fi

          gh release create "$tag" \
            "dist/YAL-HoppieHelper-${VERSION}.zip#YAL-HoppieHelper-${VERSION}.zip" \
            "dist/YAL-HoppieHelper-${VERSION}-manifest.txt#YAL-HoppieHelper-${VERSION}-manifest.txt" \
            "dist/YAL-HoppieHelper-${VERSION}-manifest.json#YAL-HoppieHelper-${VERSION}-manifest.json" \
            "dist/YAL-HoppieHelper-${VERSION}-checksums.txt#YAL-HoppieHelper-${VERSION}-checksums.txt" \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes-file dist/release-notes.md \
            "${prerelease_flag[@]}" \
            "${draft_flag[@]}"

      - name: Summary
        run: |
          {
            echo "### YAL HoppieHelper GitHub release"
            echo
            echo "- Channel: \`$CHANNEL\`"
            echo "- Version: \`$VERSION\`"
            echo "- Package: \`dist/YAL-HoppieHelper-${VERSION}.zip\`"
            echo "- File-list manifest: \`dist/YAL-HoppieHelper-${VERSION}-manifest.txt\`"
            echo "- JSON manifest: \`dist/YAL-HoppieHelper-${VERSION}-manifest.json\`"
            echo "- Checksums: \`dist/YAL-HoppieHelper-${VERSION}-checksums.txt\`"
          } >> "$GITHUB_STEP_SUMMARY"
